<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cartesian Product Calculator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div id="container" class="button-container"></div>
    </div>

    <div id="content">
        <div id="inputContainer">
            <div class="input-group">
                <textarea class="inputItem" placeholder="Item" rows="1"></textarea>
                <textarea class="inputOptions" placeholder="Options" rows="1">true, false</textarea>
            </div>
        </div>
        <div id="result"></div>
    </div>

   
    <div id="historyButton"></div>
    <div id="historyPanel" class="hidden">
        <div id="cacheContainer"></div>
    </div>

    <script src="scripts.js"></script>
</body>
</html>
